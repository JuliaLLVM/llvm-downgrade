name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: LLVM ${{ matrix.target }} bitcode
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build LLVM 5/7 locally; use LLVM_full_jll for newer readers.
          - target: '5.0'
            legacy: '5'
            dis_option: LLVMDG_DIS_5_0
            opt_option: LLVMDG_OPT_5_0
          - target: '7.0'
            legacy: '7'
            build_library: 'OFF'
            dis_option: LLVMDG_DIS_7_0
            opt_option: LLVMDG_OPT_7_0
          - target: '14.0'
            llvm_full: '14.0.6'
            dis_option: LLVMDG_DIS_14_0
            opt_option: LLVMDG_OPT_14_0
          - target: '18.0'
            llvm_full: '18.1.7'
            link_dylib: 'ON'
            dis_option: LLVMDG_DIS_18_0
            opt_option: LLVMDG_OPT_18_0

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 23
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo apt-get install -y llvm-23-dev llvm-23-tools ninja-build

      - name: Cache legacy LLVM tools
        if: matrix.legacy
        id: legacy-cache
        uses: actions/cache@v4
        with:
          path: legacy-llvm-${{ matrix.legacy }}
          key: legacy-llvm-${{ matrix.legacy }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/legacy-llvm/**') }}

      - name: Build legacy LLVM tools
        if: matrix.legacy && steps.legacy-cache.outputs.cache-hit != 'true'
        run: ci/legacy-llvm/build.sh ${{ matrix.legacy }} legacy-llvm-${{ matrix.legacy }}

      - name: Locate legacy llvm-dis and opt
        if: matrix.legacy
        run: |
          echo "DIS=$PWD/legacy-llvm-${{ matrix.legacy }}/bin/llvm-dis" >> "$GITHUB_ENV"
          echo "OPT=$PWD/legacy-llvm-${{ matrix.legacy }}/bin/opt" >> "$GITHUB_ENV"

      - uses: julia-actions/setup-julia@v2
        if: matrix.llvm_full
        with:
          version: '1'

      - uses: julia-actions/cache@v2
        if: matrix.llvm_full

      - name: Fetch legacy disassembler (LLVM_full_jll)
        if: matrix.llvm_full
        env:
          LLVM_FULL_VERSION: ${{ matrix.llvm_full }}
        run: |
          julia -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.add(name="LLVM_full_jll", version=ENV["LLVM_FULL_VERSION"])
            using LLVM_full_jll
            open(ENV["GITHUB_ENV"], "a") do io
                println(io, "DIS=", joinpath(LLVM_full_jll.artifact_dir,
                                             "tools", "llvm-dis"))
                println(io, "OPT=", joinpath(LLVM_full_jll.artifact_dir,
                                             "tools", "opt"))
            end'

      - name: Check legacy tools
        run: |
          "$DIS" --version
          "$OPT" --version

      - name: Configure
        env:
          DIS_OPTION: ${{ matrix.dis_option }}
          OPT_OPTION: ${{ matrix.opt_option }}
          BUILD_LIBRARY: ${{ matrix.build_library || 'ON' }}
          LINK_DYLIB: ${{ matrix.link_dylib || 'OFF' }}
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm \
            -DLLVMDG_BUILD_LIBRARY="$BUILD_LIBRARY" \
            -DLLVMDG_LINK_DYLIB="$LINK_DYLIB" \
            -D"$DIS_OPTION=$DIS" -D"$OPT_OPTION=$OPT"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check legacy code generation
        if: matrix.legacy
        env:
          LEGACY: ${{ matrix.legacy }}
          TARGET: ${{ matrix.target }}
        run: |
          printf 'define i32 @f() { ret i32 42 }\n' |
            build/llvm-downgrade --bitcode-version="$TARGET" -o smoke.bc
          "legacy-llvm-$LEGACY/bin/llc" -mtriple=x86_64-pc-linux-gnu -filetype=obj smoke.bc -o smoke.o

  library:
    name: Library only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 23
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo apt-get install -y llvm-23-dev llvm-23-tools ninja-build
      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm \
            -DLLVMDG_BUILD_TOOL=OFF
      - name: Build and test
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure

  integration:
    name: ROCm device libraries
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 23
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
          sudo apt-get install -y llvm-23-dev llvm-23-tools ninja-build

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Fetch legacy LLVM binaries (LLVM_full_jll)
        run: |
          for spec in 14:14.0.6 18:18.1.7; do
            MAJOR="${spec%%:*}" VERSION="${spec#*:}" julia -e '
              using Pkg
              Pkg.activate(; temp=true)
              Pkg.add(name="LLVM_full_jll", version=ENV["VERSION"])
              using LLVM_full_jll
              open(ENV["GITHUB_ENV"], "a") do io
                  println(io, "DIS_", ENV["MAJOR"], "=",
                          joinpath(LLVM_full_jll.artifact_dir, "tools", "llvm-dis"))
                  println(io, "OPT_", ENV["MAJOR"], "=",
                          joinpath(LLVM_full_jll.artifact_dir, "tools", "opt"))
              end'
          done

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm \
            -DLLVMDG_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build

      - name: Downgrade the device libraries
        run: |
          julia --startup-file=no test/integration/downgrade_devicelibs.jl \
            --tool build/llvm-downgrade \
            --dis-14 "$DIS_14" --opt-14 "$OPT_14" \
            --dis-18 "$DIS_18" --opt-18 "$OPT_18"
